[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ed-resource-optimizer"
version = "0.1.0"
description = "Simulación y optimización de recursos en un departamento de emergencias"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "plotly>=5.24,<7.0",
  "simpy>=4.1,<5.0",
  "streamlit>=1.39,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[project.scripts]
ed-sim = "ed_simulation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
